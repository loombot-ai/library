<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- A PHONE NEEDS THIS OR IT LAYS THE PAGE OUT AT 980 px AND SCALES IT DOWN: every max-width
         binds against 980 instead of the screen, and every @media below is evaluated against 980 too, so
         the phone rules never fire (the viewer had the same hole; see file-viewer/src/index.html). -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tic-tac-toe — a loom app</title>
    <!--
      THE BOARD example of a loom app page, and the second one shipped: `../example/` is a tally, which is
      arithmetic, and this is a game, which is judgement. It was loombot's built-in board until 2026-09-22,
      refereed inside the daemon; it is now an ordinary app whose rules sit in rules.ts beside this file.

      Three things about it are worth copying:

        1. It is ONE FETCH AND NO SOCKET. The page is served by loombot at /a/<id>/app/<name>/ out of the
           bytes its MCP server registered, and its data is one POST to "__event" under that same address
           (README.md, "An app is FETCH-FIRST and has no socket"). The address is RELATIVE and that is the
           whole point: this page is at /a/<session>/app/<name>/ on the machine and at
           /d/<device>/a/<session>/app/<name>/ at the edge, where a service worker carries the HTML, this
           file and the answer as ONE mechanism — and is where a socket would not be carried at all.
        2. The grid is rendered from one "state" action and nothing else, so a reload, a click and the
           opponent's move all go through the same code path. A page with two ways to draw a board has two
           ways to draw an illegal one.
        3. The waiting is SAID OUT LOUD — and so is a failure. A click is answered in a few milliseconds;
           the opponent's move costs a turn boundary, so the page says "thinking…" rather than pretending
           the delay is not there. And because there is no socket to close, a page that cannot reach its
           app has to SAY SO: "#channel" is that sentence, and without it an empty grid and a page that
           never drew one are the same picture.
    -->
    <!--
      LOOMBOT'S PALETTE, in one line: the daemon serves its own variables at /theme.css (loombot/theme.ts) and
      every colour below is one of them. An app that writes its own hex codes, or asks the browser which
      theme it is in, will sometimes disagree with the panel around it — that is a measured bug, not a
      hypothetical one (see the file-viewer entry and tests/app_viewer_test.ts). Link, spend variables, and
      the app cannot disagree.
    -->
    <!--
      THE SHAPE OF THIS FOLDER IS THE SHAPE OF A LOOM APP, and this page is copied with it (card
      t20261109-233649-9f35): src/ is HAND-WRITTEN (this file, app.js, ttt.css), assets/ is ONLY what
      `deno task build` writes and is what the app registers (`--dir assets`), and rules.ts sits at the top
      because a .ts is never handed to a browser. One command builds it, esbuilds and minifies, prints what
      every artifact weighs and prunes what it did not make. A page that hand-writes its CSS inline again
      loses all of that, and `deno task app-shape` says so.
    -->
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="ttt.css" />
  </head>
  <body>
    <h1>tic-tac-toe</h1>
    <p>
      You are <strong>X</strong>. You move first.

    <p id="channel"></p>
    <div id="board"></div>
    <p id="verdict"></p>
    <p id="note"></p>
    <p>
      <button id="new">new game</button>
      <button id="quit">Quit</button>
    </p>

    <script src="app.js" type="module"></script>
  </body>
</html>
